name: 每日更新 A 股决策简报

on:
  schedule:
    # UTC 07:30 = 北京时间 15:30（A 股收盘后），每天跑一次
    - cron: '30 7 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动点「Run workflow」立即更新

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓一次数据并写入页面
        run: python update_data.py

      - name: 提交当天快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 每日数据更新 $(date -u +%F)"
            git push
          fi
